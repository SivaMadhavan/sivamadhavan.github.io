baseURL = 'http://localhost:1313/'
languageCode = 'en-us'
title = 'My Hugo Blog'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[pagination]
  pagerSize = 5

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "My Hugo Blog"
  description = "A fast, minimalist blog built with Hugo and PaperMod"
  author = "Siva"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "Welcome to My Blog 👋"
    Content = "Sharing insights, tutorials, and notes on software engineering, technology, and building modern applications."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]
